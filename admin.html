<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>পড়াশোনা সাথী</title>
<style>
:root{--bg:#f3f1ea;--card:#faf9f5;--ink:#1c1b18;--mut:#6b675e;--line:#dcd8cb;--pri:#0a6cf0;--ok:#2a6b46;--red:#b32d1e;--l0:#e8e4da;--l1:#adc3dc;--l2:#79a1d3;--l3:#3b7bd0;--l4:#0b5fcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--card:#23221f;--ink:#f0ede4;--mut:#a09b8f;--line:#3a3833;--l0:#35332e}}
:root[data-theme="dark"]{--bg:#1a1917;--card:#23221f;--ink:#f0ede4;--mut:#a09b8f;--line:#3a3833;--l0:#35332e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:22px;margin:0;color:#0aa77a}
h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button.p{background:var(--pri);color:#fff;border:0}
.days{background:#f5e3e0;color:var(--red);border-radius:16px;padding:8px 16px;text-align:center}
.days b{font-size:34px;display:block;line-height:1.1}
.bar{height:8px;background:var(--l0);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;padding:0;background:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats b{font-size:24px;display:block}
.big{font-size:44px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:14px 0}
.grid span{aspect-ratio:1;border-radius:5px;border:1px solid var(--line)}
.grid .today{outline:2px solid var(--ink)}
 const mins=Object.values(log).reduce((a,b)=>a+b,0),ks=Object.keys(log).filter(k=>log[k]>0).map(Number),days=ks.length,last=days?Math.max(...ks):null;
 let st=0;for(let k=di;k>=0;k--){if(log[k])st++;else if(k!==di)break}
 const qa=[].concat(...Object.values(U.quiz||{})),qavg=qa.length?qa.reduce((a,q)=>a+q.sc,0)/qa.length:null;
 const subj=SU.map((s,i)=>{if(U.sel&&!U.sel.includes(i))return null;const ts=TT.filter(t=>t.s===i),a=ts.reduce((x,t)=>x+t.w,0),d=ts.filter(t=>dn[t.id]);return{n:s[0],p:a?d.reduce((x,t)=>x+t.w,0)/a*100:0,c:d.length,t:ts.length}}).filter(Boolean);
 return{max:MXs,name:U.name||'(নামহীন)',score,done:done.length,total:TT.length,mins,days,st,last,today:log[di]||0,qn:qa.length,qavg,left:Math.max(0,(U.total||95)-1-di),w7:[0,1,2,3,4,5,6].map(k=>log[di-k]||0),subj,goal:U.goal||Math.round(MXs*.65),start:U.start}}

let ADMX=null,DATA=null,AMSG='';
const A=()=>document.getElementById('app'),$=id=>document.getElementById(id);
function loginView(){
 A().innerHTML=`<div class="card"><h2>অ্যাডমিন প্রবেশ</h2><input id="ae" type="email" placeholder="অ্যাডমিন ইমেইল" style="width:100%;margin:6px 0"><input id="ap" type="password" placeholder="পাসওয়ার্ড" style="width:100%;margin:6px 0"><div id="am" style="color:var(--red);margin:6px 0">${AMSG}</div><button class="p" id="ag" style="width:100%">প্রবেশ</button></div>`;
 $('ag').onclick=async()=>{const r=await SB.auth.signInWithPassword({email:$('ae').value.trim(),password:$('ap').value});if(r.error){AMSG='ইমেইল বা পাসওয়ার্ড ভুল';loginView();return}boot()}}
async function boot(){
 const g=await SB.auth.getUser();
 if(!g.data||!g.data.user){loginView();return}
 const ad=await SB.from('ps_admins').select('user_id').eq('user_id',g.data.user.id).maybeSingle();
 if(!ad.data){await SB.auth.signOut();AMSG='এই অ্যাকাউন্ট অ্যাডমিন নয়';loginView();return}
 A().innerHTML='<div class="mut" style="padding:40px;text-align:center">সব ইউজারের তথ্য আনা হচ্ছে…</div>';
 const [p,st]=await Promise.all([SB.from('ps_profiles').select('*'),SB.from('ps_state').select('user_id,data')]);
 const sm={};(st.data||[]).forEach(x=>sm[x.user_id]=x.data);
 DATA=(p.data||[]).map(pr=>({pr,U:Object.assign({},sm[pr.id]||{start:today0(),total:pr.total_days,log:{}},{name:pr.name||undefined})}));
 list()}
function list(){
 const R=DATA.map(o=>({...mx(o.U),key:o.pr.id,email:o.pr.email||'',pr:o.pr})).sort((a,b)=>b.score-a.score);
 const act=R.filter(r=>r.today>0).length,avg=R.length?R.reduce((a,r)=>a+r.score,0)/R.length:0;
 const fd=r=>r.last==null?'—':new Date(r.start+r.last*DAY).toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
 const rows=R.map((r,i)=>`<div class="card" style="margin:8px 0;padding:14px"><div class="row" data-ax="${r.key}" style="cursor:pointer"><b>${bn(i+1)}. ${r.name}</b><b>${bn(r.score)}/${bn(r.max)}</b></div><div class="mut">${bn(r.done)}/${bn(r.total)} টপিক · ${bn(r.mins/60)} ঘণ্টা · টানা ${bn(r.st)} দিন · শেষ: ${fd(r)}</div><div class="bar"><i style="width:${Math.min(100,r.score/r.max*100)}%"></i></div>${ADMX===r.key?`<div style="margin-top:8px;line-height:1.7"><div style="background:var(--l0);border-radius:12px;padding:10px;margin-bottom:8px"><div>নাম: <b>${r.name}</b></div><div>ইমেইল: <b>${r.email||'—'}</b></div><div class="mut">পাসওয়ার্ড কেউ দেখতে পায় না। ভুলে গেলে ইমেইলে রিসেট লিংক পাঠান:</div><button class="p" data-rs="${r.email}" style="margin-top:6px">রিসেট লিংক পাঠান</button><div id="rm" style="margin-top:6px"></div></div>লক্ষ্য ${bn(r.goal)} নম্বর · ${bn(r.left)} দিন বাকি<br>আজ ${bn(r.today)} মিনিট · কুইজ: ${r.qn?bn(r.qavg)+' গড় ('+bn(r.qn)+' বার)':'দেয়নি'}<div class="mut" style="margin-top:6px">গত ৭ দিন (পুরনো থেকে আজ)</div><div style="display:flex;gap:4px;align-items:flex-end;height:50px">${r.w7.slice().reverse().map(m=>`<div style="flex:1;background:var(--l3);border-radius:3px;height:${Math.max(3,Math.min(50,m/60*20))}px"></div>`).join('')}</div><div style="margin-top:8px">${r.subj.map(s=>`<div class="row" style="margin:4px 0"><span>${s.n}</span><b>${bn(s.c)}/${bn(s.t)}</b></div><div class="bar" style="margin:2px 0"><i style="width:${s.p}%"></i></div>`).join('')}</div></div>`:''}</div>`).join('');
 A().innerHTML=`<div class="row" style="margin:8px 0"><button id="rf">🔄 রিফ্রেশ</button><button id="lo">লগআউট</button></div><div class="card"><h2>সব ইউজার</h2><div class="stats"><div><b>${bn(R.length)}</b><span class="mut">ইউজার</span></div><div><b>${bn(act)}</b><span class="mut">আজ সক্রিয়</span></div><div><b>${bn(avg)}</b><span class="mut">গড় স্কোর</span></div></div></div>${rows||'<div class="mut">এখনো কোনো ইউজার নেই</div>'}`;
 $('rf').onclick=boot;$('lo').onclick=async()=>{await SB.auth.signOut();DATA=null;AMSG='';loginView()};
 document.querySelectorAll('[data-ax]').forEach(b=>b.onclick=()=>{ADMX=ADMX===b.dataset.ax?null:b.dataset.ax;list()});
 document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const m=$('rm'),em=b.dataset.rs;if(!em){m.textContent='ইমেইল পাওয়া যায়নি';return}const r=await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/'});m.style.color=r.error?'var(--red)':'var(--ok)';m.textContent=r.error?'পাঠানো যায়নি, একটু পরে চেষ্টা করুন':'✓ রিসেট লিংক পাঠানো হয়েছে'})}
document.getElementById('app').innerHTML='<div class="mut" style="padding:40px;text-align:center">লোড হচ্ছে…</div>';
boot();
</script>
</body>
</html>
